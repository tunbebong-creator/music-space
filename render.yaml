services:
  # Backend API
  - type: web
    name: music-space-api
    env: node
    buildCommand: npm install --legacy-peer-deps
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # Frontend Static Site
  - type: web
    name: music-space-frontend
    env: static
    buildCommand: NODE_ENV=development npm install --legacy-peer-deps && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://usic-space-server.onrender.com/api

  # Cron job to keep services awake (ping every 5 minutes)
  - type: cron
    name: keep-services-awake
    schedule: "*/5 * * * *"  # Every 5 minutes
    env: node
    buildCommand: npm install --legacy-peer-deps
    startCommand: node keep-awake.js
    envVars:
      - key: BACKEND_URL
        value: https://usic-space-server.onrender.com
      - key: FRONTEND_URL
        value: https://music-space-frontend.onrender.com




